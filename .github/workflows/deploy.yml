# Publica el sitio estático en GitHub Pages en cada push a main.
# Activar en: Settings → Pages → Source: "GitHub Actions".
#
# Variables opcionales (Settings → Secrets and variables → Actions → Variables):
#   VITE_GAS_URL      URL /exec de Apps Script (por defecto la de src/config.js)
#   VITE_API_TOKEN    token que valida Code.gs (por defecto el de src/config.js)
#   VITE_DATA_SOURCE  "sheets" (por defecto) o "local"
#   VITE_BASE         "/" si usas dominio propio; por defecto "/<nombre-del-repo>/"
name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GAS_URL: ${{ vars.VITE_GAS_URL }}
          VITE_API_TOKEN: ${{ vars.VITE_API_TOKEN }}
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
